[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chart-recover"
version = "0.1.0"
description = "Evidence-grounded recovery of hidden-axis charts"
# Valid TOML quoting prevents the pinned scanner from treating this metadata key as a PyPI requirement.
"requires-python" = ">=3.12"
dependencies = ["numpy>=2.5.3", "scipy>=1.18.1", "Pillow>=10.4", "matplotlib>=3.7", "requests>=2.32"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
chart-recover = "chart_recover.cli:main"

[tool.setuptools.packages.find]
where = ["skills/chart-recover/scripts"]

[tool.setuptools.package-data]
chart_recover = ["web/*.html", "web/*.js", "assets/*.json", "assets/examples/*/*.png", "assets/examples/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/chart-recover/scripts"]
