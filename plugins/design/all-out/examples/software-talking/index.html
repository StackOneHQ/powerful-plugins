<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On Speaking Terms</title>
<link rel="icon" href="data:,">
<style>
:root{
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",Georgia,"Liberation Serif","DejaVu Serif",serif;
  --sans:"Helvetica Neue",Helvetica,"Segoe UI",Roboto,"Noto Sans","Liberation Sans",Arial,sans-serif;
  --mono:"SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono","DejaVu Sans Mono","Liberation Mono",monospace;
  --times:"Times New Roman",Times,"Liberation Serif","DejaVu Serif",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;color:#fff}
body.auto{cursor:none}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:#030304}
#scenes{position:absolute;left:0;top:0;width:1920px;height:1080px}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;visibility:hidden;transform-origin:50% 50%}
.scene.on{visibility:visible}
.abs{position:absolute}
.world{position:absolute;left:0;top:0;width:1920px;height:1080px}
#fx{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:5}
#scan{position:absolute;left:0;top:0;width:1920px;height:3px;z-index:6;opacity:0;pointer-events:none;background:#fff;box-shadow:0 0 16px 4px rgba(255,255,255,.75),0 0 70px 18px rgba(150,210,255,.35)}
#vig{position:absolute;inset:0;pointer-events:none;z-index:7;background:radial-gradient(ellipse 78% 72% at 50% 48%,transparent 58%,rgba(0,0,0,.38) 100%)}
#hud{position:absolute;inset:0;pointer-events:none;z-index:8}
#grain{position:absolute;inset:0;pointer-events:none;z-index:9;opacity:.055;mix-blend-mode:overlay;background-size:180px 180px}
#hint{position:absolute;right:40px;bottom:22px;z-index:10;font:500 15px/1 var(--mono);letter-spacing:.04em;color:rgba(255,255,255,.55);opacity:0;pointer-events:none;white-space:nowrap}
#hint b{color:#fff;font-weight:600;padding:2px 6px;border:1px solid rgba(255,255,255,.3);border-radius:4px;margin:0 6px 0 18px}
#paused{position:absolute;right:40px;top:30px;z-index:10;font:600 15px/1 var(--mono);letter-spacing:.2em;color:#fff;opacity:0}

/* odometer + timeline */
#odo{position:absolute;left:100px;top:62px;height:150px;display:flex;font:700 150px/150px var(--sans);font-variant-numeric:tabular-nums lining-nums;opacity:0}
#odo .wh{position:relative;width:90px;height:150px;overflow:hidden;-webkit-mask-image:linear-gradient(transparent 0,#000 11%,#000 89%,transparent 100%);mask-image:linear-gradient(transparent 0,#000 11%,#000 89%,transparent 100%)}
#odo .st{position:absolute;left:0;top:0;width:100%}
#odo .st span{display:block;height:150px;text-align:center}
#tl{position:absolute;left:112px;top:1024px;width:1698px;height:40px;opacity:0}
#tl .rail{position:absolute;left:0;right:0;top:6px;height:1px;background:currentColor;opacity:.2}
#tl .fill{position:absolute;left:0;top:6px;height:1px;background:currentColor;opacity:.8;width:0}
#tl .tk{position:absolute;top:2px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:currentColor;opacity:.3}
#tl .lb{position:absolute;top:21px;font:500 13px/1 var(--mono);letter-spacing:.05em;transform:translateX(-50%);opacity:.4;white-space:nowrap}

/* shared scene text */
.kicker{position:absolute;left:112px;top:248px;font:600 18px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;white-space:nowrap;color:var(--kc,rgba(255,255,255,.62))}
.kicker i{display:inline-block;width:30px;height:2px;margin-right:14px;vertical-align:5px;background:currentColor}
.head{position:absolute;left:624px;top:96px;width:1190px;font:600 64px/1.1 var(--sans);letter-spacing:-.012em;color:var(--hc,#fff)}
.head .w{display:inline-block;white-space:pre}
.cap{position:absolute;left:112px;top:872px;width:830px;font:400 23px/1.47 var(--sans);color:var(--cc,rgba(255,255,255,.76))}
.cap b{font-weight:600;color:var(--cb,#fff)}
pre.code{font:400 24px/1.5 var(--mono);white-space:pre;color:#e6e7ea}
.t-k{color:#8fd3ff}.t-s{color:#ffd479}.t-n{color:#ff9e7a}.t-p{color:#8e95a1}.t-t{color:#ff9a57}.t-a{color:#ffd479}.t-c{color:#7d8590}.t-f{color:#c9b2ff}.t-b{color:#ff86c0}
.cur{position:relative}
.cur::after{content:"";position:absolute;left:100%;top:.14em;width:.58em;height:1.08em;background:currentColor;opacity:.85}

/* title */
.s-title{background:radial-gradient(ellipse 62% 58% at 50% 64%,#2b2219 0%,#130f0b 55%,#060504 100%)}
.t-spot{position:absolute;left:210px;top:330px;width:1500px;height:760px;background:radial-gradient(ellipse at center,rgba(255,224,165,.15),transparent 66%)}
.t-persp{perspective:1800px;perspective-origin:50% 38%}
.t-card{position:absolute;left:960px;top:690px;transform-style:preserve-3d}
.t-card canvas{display:block;filter:drop-shadow(0 40px 46px rgba(0,0,0,.6)) drop-shadow(0 5px 8px rgba(0,0,0,.35))}
.chad{position:absolute;background:#e9dab4;opacity:0;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.t-title{text-align:center;font:500 152px/1 var(--serif);letter-spacing:-.012em;color:#f4ebd8}
.t-title .ch{display:inline-block}
.t-sub{text-align:center;font:italic 400 36px/1.2 var(--serif);color:rgba(244,235,216,.74)}

/* 1890 */
.s-paper{background:radial-gradient(ellipse 85% 80% at 55% 45%,#f7f0de 0%,#ece2c9 58%,#d6c59f 100%);--kc:#7d5f3d;--hc:#241c14;--cc:rgba(36,28,20,.84);--cb:#120d08}
.h-serif{font:500 70px/1.08 var(--serif);letter-spacing:-.01em}

/* 1964 */
.s-batch{background:radial-gradient(ellipse 60% 70% at 52% 60%,#1d1f1b 0%,#0e0f0d 60%,#070806 100%);--kc:#a9c2a2;--hc:#efe9d8}
.h-print{font:700 56px/1.14 var(--mono);text-transform:uppercase;letter-spacing:.01em}
.b-wrap{-webkit-mask-image:linear-gradient(to bottom,transparent 0,transparent 262px,#000 340px);mask-image:linear-gradient(to bottom,transparent 0,transparent 262px,#000 340px)}
.b-rot{position:absolute;left:0;top:0;width:860px;height:1080px;transform:rotate(-1.3deg);transform-origin:50% 80%}
.b-sheet{position:absolute;left:0;top:0;width:860px;height:2700px;box-shadow:0 30px 90px rgba(0,0,0,.65);
 background:
  repeating-linear-gradient(to bottom,rgba(0,0,0,.2) 0 6px,transparent 6px 12px) 52px 0/1px 100% no-repeat,
  repeating-linear-gradient(to bottom,rgba(0,0,0,.2) 0 6px,transparent 6px 12px) 807px 0/1px 100% no-repeat,
  radial-gradient(circle at 26px 19px,#0b0c0a 0 7px,rgba(0,0,0,.25) 7.6px,transparent 8.4px) 0 0/52px 38px repeat-y,
  radial-gradient(circle at 26px 19px,#0b0c0a 0 7px,rgba(0,0,0,.25) 7.6px,transparent 8.4px) 808px 0/52px 38px repeat-y,
  repeating-linear-gradient(to bottom,#d3e7cc 0 76px,#f6f8f0 76px 152px) 53px 0/754px 100% no-repeat,
  #f4f5ec}
.b-line{position:absolute;left:84px;font:600 25px/38px var(--mono);color:#253229;white-space:pre;letter-spacing:.01em;text-shadow:0 0 .6px rgba(20,30,25,.6)}
.b-printer{background:linear-gradient(#20221e,#0c0d0b 40%);border-top:2px solid #3a3d37;box-shadow:0 -24px 50px rgba(0,0,0,.7)}
.b-printer::before{content:"";position:absolute;left:30px;right:30px;top:12px;height:3px;background:#050605;border-radius:2px;box-shadow:0 1px 0 rgba(255,255,255,.08)}
.b-step{border:2px solid rgba(207,227,200,.28);border-radius:8px;font:700 34px/1 var(--mono);color:rgba(233,238,227,.55);display:flex;flex-direction:column;justify-content:center;padding-left:28px;letter-spacing:.04em;background:rgba(207,227,200,.03)}
.b-step small{font:600 15px/1 var(--mono);letter-spacing:.24em;color:#9fb59a;margin-bottom:12px}
.b-step.on{border-color:#d7ecd0;color:#f2f6ee;box-shadow:0 0 34px rgba(190,230,180,.22),inset 0 0 20px rgba(190,230,180,.08)}
.b-path{border-left:3px dotted rgba(207,227,200,.35)}
.b-lb{font:600 17px/1 var(--mono);letter-spacing:.12em;color:#cfe3c8;white-space:nowrap}

/* 1969 */
.s-arpa{background:radial-gradient(ellipse 70% 70% at 62% 55%,#0d1938 0%,#070d1f 55%,#03060f 100%);--kc:#7fb6e6;--hc:#e8f3ff}
.s-arpa .dots{position:absolute;inset:0;background:radial-gradient(circle,rgba(140,190,255,.16) 1.2px,transparent 1.6px) 0 0/32px 32px}
.h-mono{font:600 50px/1.12 var(--mono);letter-spacing:-.02em}
.a-link{stroke:#8fd0ff;stroke-width:3;fill:none}
.a-ghost{stroke:#8fd0ff;stroke-width:2;stroke-dasharray:6 10;fill:none;opacity:0}
.a-node{fill:#0a1430;stroke:#a9dcff;stroke-width:3}
.a-ring{fill:none;stroke:#a9dcff;stroke-width:2}
.a-lb{font:700 30px var(--mono);fill:#eaf5ff;letter-spacing:.02em}
.a-sub{font:500 17px var(--mono);fill:#7fa6c9;letter-spacing:.04em}
.a-term{border:2px solid rgba(169,220,255,.35);border-radius:14px;background:rgba(5,12,28,.82);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.a-th{padding:18px 24px;border-bottom:1px solid rgba(169,220,255,.2);font:600 18px/1 var(--mono);letter-spacing:.18em;color:#8fbfe8}
.a-big{padding:26px 36px 0;font:700 170px/1 var(--mono);color:#f1f8ff;letter-spacing:.06em;white-space:nowrap}
.a-big span{display:inline-block}
.a-crash{position:absolute;left:38px;bottom:28px;font:600 20px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#ff6b7d}
.a-flash{background:#e8f6ff;opacity:0;mix-blend-mode:screen}
.a-note{font:600 19px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#8fd0ff}

/* 1973 */
.s-unix{background:radial-gradient(ellipse 70% 70% at 62% 58%,#07140c 0%,#030805 60%,#010201 100%);--kc:#6fd896;--hc:#9dffc0}
.h-phos{font:500 52px/1.12 var(--mono);color:#9dffc0;text-shadow:0 0 10px rgba(110,255,160,.55),0 0 28px rgba(110,255,160,.25)}
.u-attr{font:500 21px/1 var(--mono);letter-spacing:.06em;color:rgba(140,255,180,.6)}
.u-scr{border-radius:38px;overflow:hidden;background:radial-gradient(ellipse 85% 80% at 50% 50%,#0d2b19 0%,#06170d 62%,#020a05 100%);box-shadow:0 0 0 12px #0b0f0c,0 0 0 14px #1d241f,0 40px 90px rgba(0,0,0,.7),inset 0 0 90px rgba(0,0,0,.85);color:#8dffb6}
.u-cmd{font:500 34px/1.3 var(--mono)!important;color:#a8ffc8!important;text-shadow:0 0 8px rgba(120,255,170,.6),0 0 22px rgba(120,255,170,.25)}
.u-cmd span{color:inherit!important}
.u-box{border:2px solid #7dffaf;border-radius:6px;font:600 34px/92px var(--mono);text-align:center;color:#b5ffd1;text-shadow:0 0 10px rgba(120,255,170,.7);box-shadow:0 0 22px rgba(110,255,160,.25),inset 0 0 18px rgba(110,255,160,.12)}
.u-pipe{border-top:3px solid #4fd987;border-bottom:3px solid #4fd987;box-shadow:0 0 16px rgba(110,255,160,.25);background:rgba(110,255,160,.05)}
.u-flow{font:600 26px/1 var(--mono);color:#e5ffef;text-shadow:0 0 8px #6dff9f;white-space:nowrap;opacity:0}
.u-ln{font:600 34px/1 var(--mono);color:#c8ffdc;text-shadow:0 0 12px rgba(120,255,170,.7);opacity:0}
.u-plb{font:500 20px/1 var(--mono);letter-spacing:.12em;text-align:center;color:rgba(160,255,195,.75);text-shadow:0 0 8px rgba(120,255,170,.5);opacity:0}
.u-lines{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.32) 0 2px,transparent 2px 4px);pointer-events:none}
.u-glass{position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 30% 12%,rgba(255,255,255,.07),transparent 70%);pointer-events:none}

/* packets */
.s-net{background:radial-gradient(ellipse 70% 70% at 58% 55%,#0b1824 0%,#060c13 60%,#020407 100%);--kc:#86c6e8;--hc:#eaf6ff}
.n-edge{stroke:rgba(140,205,240,.32);stroke-width:2;fill:none}
.n-node{fill:#08131d;stroke:#8ccdf0;stroke-width:2.5}
.n-host{fill:#0a1a26;stroke:#bfe6ff;stroke-width:2.5}
.n-lb{font:600 19px var(--mono);fill:#9ecbe6;letter-spacing:.06em}
.pk{position:absolute;left:0;top:0;padding:9px 15px 9px 12px;border:2px solid #7fd3ff;border-radius:9px;background:#06141e;color:#eaf7ff;font:600 24px/1 var(--mono);white-space:nowrap;box-shadow:0 0 22px rgba(127,211,255,.3);opacity:0}
.pk small{display:inline-block;font:700 14px/1 var(--mono);color:#7fd3ff;margin-right:10px;vertical-align:3px;letter-spacing:.05em}
.pk.src{border-color:rgba(234,246,255,.5);box-shadow:none;font-size:26px}

/* rpc */
.s-rpc{background:radial-gradient(ellipse 70% 70% at 60% 50%,#151827 0%,#0b0d16 60%,#050609 100%);--kc:#e7a6d9;--hc:#fff}
.r-win{border-radius:14px;background:#0d1020;border:1px solid rgba(255,255,255,.13);box-shadow:0 30px 70px rgba(0,0,0,.55);overflow:hidden}
.r-tb{height:44px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;font:600 16px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.55);background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08)}
.r-win pre.code{position:absolute;left:28px;top:70px;font-size:26px;line-height:1.55}
.r-chip{position:absolute;left:0;top:0;padding:7px 12px;border-radius:8px;font:600 24px/1 var(--mono);white-space:nowrap;opacity:0}
.r-call{background:#3a1238;border:2px solid #ff6ad5;color:#ffd6f5;box-shadow:0 0 24px rgba(255,106,213,.4)}
.r-bytes{background:#0f1a2a;border:2px solid #7fd3ff;color:#bfe9ff;box-shadow:0 0 24px rgba(127,211,255,.35);letter-spacing:.06em}
.r-ret{background:#123326;border:2px solid #6ee7a8;color:#d5ffe8;box-shadow:0 0 24px rgba(110,231,168,.35)}
.r-stub{font:600 16px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.5);white-space:nowrap}
.r-wire{fill:none;stroke:rgba(255,255,255,.22);stroke-width:2.5}
.r-badge{font:600 26px/1 var(--mono);color:#7ef0b0;white-space:nowrap}

/* web 1991 */
.s-web{background:radial-gradient(ellipse 70% 70% at 55% 55%,#1a1b21 0%,#0e0f13 60%,#060608 100%);--kc:#9fb2ff;--hc:#fff}
.h-times{font:400 70px/1.06 var(--times);letter-spacing:-.005em}
.w-req{font:500 32px/1 var(--mono);color:#f2f4ff}
.w-req .lbl{font:600 15px/1 var(--mono);letter-spacing:.2em;color:#8e9bd6;margin-right:18px;vertical-align:5px}
.w-win{background:#d6d6d6;border:1px solid #9a9a9a;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden}
.w-tb{height:36px;background:linear-gradient(#e9e9e9,#c6c6c6);border-bottom:1px solid #8d8d8d;font:600 16px/36px var(--sans);color:#222;text-align:center}
.w-page{position:absolute;left:10px;top:46px;right:10px;bottom:10px;background:#fbfaf6;border:1px solid #a8a8a8;padding:34px 44px;font:400 30px/1.5 var(--times);color:#111}
.w-page h1{font:700 58px/1.1 var(--times);margin-bottom:18px}
.w-page p{margin-bottom:14px}
.w-page a{color:#0000ee;text-decoration:none;background:linear-gradient(#0000ee,#0000ee) 0 92%/0% 2px no-repeat}
.w-corba{border:1px dashed rgba(180,190,255,.4);border-radius:12px;background:rgba(160,170,255,.04);padding:22px 24px}
.w-corba h4{font:700 20px/1 var(--mono);letter-spacing:.14em;color:#c3c9ff;margin-bottom:6px}
.w-corba h5{font:500 15px/1 var(--mono);letter-spacing:.16em;color:#8088c0;margin-bottom:22px}
.w-corba pre.code{font-size:21px;line-height:1.5;color:#dfe3ff}

/* soap */
.s-soap{background:radial-gradient(ellipse 70% 70% at 55% 55%,#1c1813 0%,#100e0b 60%,#060504 100%);--kc:#e3b58e;--hc:#fff}
.e-persp{perspective:1600px}
.e-env{position:absolute;transform-style:preserve-3d}
.e-back{position:absolute;inset:0;background:#d9cfb8;border-radius:6px;box-shadow:0 40px 80px rgba(0,0,0,.55)}
.e-front{position:absolute;inset:0;background:linear-gradient(160deg,#efe7d4,#e2d7bd);clip-path:polygon(0 26%,50% 60%,100% 26%,100% 100%,0 100%);border-radius:6px}
.e-front::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent 49.6%,rgba(0,0,0,.09) 50%,transparent 50.4%),linear-gradient(to top left,transparent 49.6%,rgba(0,0,0,.09) 50%,transparent 50.4%)}
.e-flap{position:absolute;left:0;top:0;width:100%;height:62%;background:linear-gradient(#f2ebda,#e4d9c0);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;backface-visibility:visible}
.e-letter{position:absolute;left:0;top:0;width:1000px;height:420px;background:#fbf9f3;border-radius:8px;box-shadow:0 30px 70px rgba(0,0,0,.45);transform-origin:0 0;padding:44px 48px}
.e-letter pre.code{font-size:23px;line-height:1.6;color:#2a2622}
.e-letter .t-t{color:#b4461d}.e-letter .t-a{color:#8a5a00}.e-letter .t-s{color:#2c7a43}.e-letter .t-p{color:#9a8f82}
.e-stamp{position:absolute;right:42px;top:38px;font:700 15px/1 var(--mono);letter-spacing:.2em;color:#b4461d;border:2px solid #b4461d;padding:8px 10px;border-radius:4px;transform:rotate(4deg);opacity:.8}

/* rest */
.s-rest{background:radial-gradient(ellipse 70% 70% at 55% 52%,#1b1a14 0%,#0f0e0b 60%,#060605 100%);--kc:#e8cf86;--hc:#fff}
.j-url{font:600 78px/1 var(--mono);color:#fff;letter-spacing:-.01em}
.j-url .t-k{color:#ffd166}
.j-verb{position:absolute;padding:8px 16px;border-radius:999px;border:2px solid rgba(255,255,255,.22);font:700 22px/1 var(--mono);letter-spacing:.08em;color:rgba(255,255,255,.55);opacity:0}
.j-verb.on{border-color:#ffd166;color:#1a1505;background:#ffd166}
.j-brace{font:300 200px/1 var(--mono);color:#ffd166;text-shadow:0 0 30px rgba(255,209,102,.35)}
.j-body{font:500 34px/1.55 var(--mono);color:#f4f4f4}
.j-body .t-k{color:#9ad8ff}.j-body .t-s{color:#ffd166}.j-body .t-n{color:#ff9e7a}
.j-hdr{font:500 20px/1 var(--mono);color:rgba(255,255,255,.5);letter-spacing:.04em}
.j-ang{font:600 54px/1 var(--mono);color:#ff9a57}

/* hooks */
.s-hooks{background:radial-gradient(ellipse 70% 70% at 58% 52%,#121a16 0%,#0b0f0d 60%,#050606 100%);--kc:#9ad7a8;--hc:#fff}
.k-node{border:2px solid rgba(255,255,255,.2);border-radius:16px;background:#121416;padding:18px 26px}
.k-node b{display:block;font:700 34px/1 var(--sans);color:#fff;margin-bottom:10px}
.k-life{stroke:rgba(255,255,255,.26);stroke-width:2;stroke-dasharray:5 8}
.k-req{color:#f2c14e}.k-auth{color:rgba(242,193,78,.75);font-size:19px}
.k-tag.w{background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.25)}
.k-node span{font:500 18px/1 var(--mono);color:rgba(255,255,255,.5);letter-spacing:.04em}
.k-lab{font:600 21px/1 var(--mono);white-space:nowrap}
.k-poll{color:rgba(255,255,255,.55)}
.k-hook{color:#7ee787}
.k-tag{padding:7px 14px;border-radius:999px;font:700 16px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.k-tag.g{background:rgba(126,231,135,.14);color:#7ee787;border:1px solid rgba(126,231,135,.5)}
.k-tag.y{background:rgba(242,193,78,.14);color:#f2c14e;border:1px solid rgba(242,193,78,.5)}
.k-pill{padding:14px 22px;border-radius:12px;font:600 26px/1 var(--mono);white-space:nowrap}
.k-pw{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.25);color:#ddd}
.k-tok{background:#2a2313;border:2px solid #f2c14e;color:#ffe3a1;box-shadow:0 0 26px rgba(242,193,78,.3)}
.k-strike{background:#ff5d6c;height:4px;border-radius:2px;box-shadow:0 0 10px rgba(255,93,108,.6);transform-origin:0 50%}

/* contracts */

  if(f.prev>=0){const q=SC[f.prev];if(q.api.update)q.api.update(f.tp);if(q.api.draw&&p<1){ctx.save();q.api.draw(ctx,f.tp,1-E.o2(p));ctx.restore();}}
  if(s.api.update)s.api.update(f.t);
  if(s.api.draw){ctx.save();s.api.draw(ctx,f.t,f.prev>=0?E.i2(p):1);ctx.restore();}
  if(f.prev>=0&&p<1)applyTrans(s.trans||'zoom',SC[f.prev],s,p);else{resetSec(s);scanEl.style.opacity='0';}
  hud(f,p);
}

/* clock and modes */
const Q=new URLSearchParams(location.search);
const AT=Q.has('at')?parseFloat(Q.get('at')):null;let FZ=AT;
let mode=AT!=null&&isFinite(AT)?'frozen':(Q.get('autoplay')==='1'?'auto':'manual');
let autoT0=null,pausedAt=null;
const man={cur:clamp(parseInt(Q.get('scene')||'0',10)||0,0,SC.length-1),t0:0,prev:-1,pt0:0};
const now=()=>performance.now()/1000;
function sceneAt(T){let i=0;while(i<SC.length-1&&T>=cum[i+1])i++;return i;}
function frameAt(T){const i=sceneAt(T);const t=T-cum[i];let prev=-1,tp=0;if(i>0&&t<TR){prev=i-1;tp=T-cum[i-1];}return{cur:i,t,prev,tp};}
const grainEl=document.getElementById('grain'),hint=document.getElementById('hint'),pausedEl=document.getElementById('paused');
(function(){const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');const id=g.createImageData(180,180);for(let i=0;i<id.data.length;i+=4){const v=(Math.random()*255)|0;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}g.putImageData(id,0,0);grainEl.style.backgroundImage='url('+c.toDataURL()+')';})();
if(mode==='auto')document.body.classList.add('auto');
man.t0=now()-(man.cur===0?0:TR);
let hintT0=now();
function frame(){
  const n=now();let f;
  if(mode==='frozen')f=frameAt(FZ);
  else if(mode==='auto'){if(autoT0===null)autoT0=n;const T=Math.max(0,(pausedAt!==null?pausedAt:n)-autoT0);f=frameAt(T);}
  else{const t=n-man.t0;f={cur:man.cur,t,prev:t<TR?man.prev:-1,tp:n-man.pt0};}
  render(f);
  if(mode!=='frozen')grainEl.style.backgroundPosition=((Math.random()*180)|0)+'px '+((Math.random()*180)|0)+'px';
  hint.style.opacity=mode==='manual'?(1-clamp((n-hintT0-5)/1.2))*0.9:0;
  pausedEl.style.opacity=(mode==='auto'&&pausedAt!==null)?1:0;
  requestAnimationFrame(frame);
}
function go(i){i=clamp(i,0,SC.length-1)|0;if(i===man.cur)return;const n=now();man.prev=man.cur;man.pt0=man.t0;man.cur=i;man.t0=n;}
function setAutoT(T){const n=now();autoT0=(pausedAt!==null?pausedAt:n)-T;}
const NEXT=['ArrowRight','ArrowDown','PageDown',' ','Enter'],PREV=['ArrowLeft','ArrowUp','PageUp','Backspace'];
addEventListener('keydown',e=>{
  const k=e.key,n=now();
  if(k==='f'||k==='F'){if(!document.fullscreenElement){(document.documentElement.requestFullscreen||function(){}).call(document.documentElement);}else if(document.exitFullscreen)document.exitFullscreen();return;}
  if(mode==='frozen')return;
  if(NEXT.indexOf(k)>=0||PREV.indexOf(k)>=0||k==='Home'||k==='End')e.preventDefault();
  if(mode==='auto'){
    const T=Math.max(0,(pausedAt!==null?pausedAt:n)-(autoT0||n)),i=sceneAt(T);
    if(k===' '||k==='k'||k==='K'){if(pausedAt===null)pausedAt=n;else{autoT0+=n-pausedAt;pausedAt=null;}return;}
    if(NEXT.indexOf(k)>=0)setAutoT(cum[Math.min(SC.length-1,i+1)]);
    else if(PREV.indexOf(k)>=0)setAutoT(cum[(T-cum[i]>1.2)?i:Math.max(0,i-1)]);
    else if(k==='Home')setAutoT(0);else if(k==='End')setAutoT(cum[SC.length-1]);
    else if(k==='Escape'||k==='p'||k==='P'){mode='manual';document.body.classList.remove('auto');man.prev=-1;man.cur=i;man.t0=n-(T-cum[i]);pausedAt=null;hintT0=n;}
    return;
  }
  hintT0=Math.min(hintT0,n-5);
  if(NEXT.indexOf(k)>=0)go(man.cur+1);
  else if(PREV.indexOf(k)>=0)go(man.cur-1);
  else if(k==='Home')go(0);else if(k==='End')go(SC.length-1);
  else if(k==='p'||k==='P'){mode='auto';document.body.classList.add('auto');pausedAt=null;autoT0=n-cum[man.cur];}
});
function size(){const s=Math.min(innerWidth/W,innerHeight/H);const x=(innerWidth-W*s)/2,y=(innerHeight-H*s)/2;stage.style.transform='translate('+x.toFixed(2)+'px,'+y.toFixed(2)+'px) scale('+s.toFixed(5)+')';K=Math.min(2,Math.max(1,s*(window.devicePixelRatio||1)));fx.width=Math.round(W*K);fx.height=Math.round(H*K);}
addEventListener('resize',size);size();
window.__deck={total:TOTAL,durations:SC.map(s=>s.dur),ids:SC.map(s=>s.id),cum:cum.slice(),seek(T){mode='frozen';FZ=+T;document.body.classList.remove('auto');}};
requestAnimationFrame(frame);
})();
</script>
