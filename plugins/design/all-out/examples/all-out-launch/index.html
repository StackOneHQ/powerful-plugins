<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>all-out</title>
<meta name="description" content="Launch film for all-out, an open-source plugin for Claude Code and Codex.">
<style>
  :root {
    --bg: #040406;
    --paper: #f5f1e8;
    --dim: rgba(245, 241, 232, 0.5);
    --faint: rgba(245, 241, 232, 0.26);
    --ink: #0d0d11;
    --heat-a: #ff3b2f;
    --heat-b: #ff7a1f;
    --heat-c: #ffbf47;
    --ice: #bfe2ff;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
    --serif: "Iowan Old Style", Charter, "Bitstream Charter", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: var(--bg); }
  #gl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
  #ui { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; color: var(--paper); font-family: var(--sans); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  .L { position: absolute; visibility: hidden; opacity: 0; }

  /* narration */
  .cap { left: 120px; top: 104px; font-size: 44px; font-weight: 600; letter-spacing: -0.018em; line-height: 1.15; white-space: nowrap; opacity: 1; }
  .cap .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.04em 0.03em 0.16em; margin: -0.04em -0.03em -0.16em; }
  .cap .w > span { display: inline-block; will-change: transform; }
  .cap em { font-style: normal; }
  .cap em.hard { color: var(--ice); }
  .cap em.soft { color: #ff9a6b; }

  /* the run */
  #run { left: 0; top: 0; width: 1920px; height: 1080px; color: var(--ink); transform-origin: 960px 540px; }
  #run-head { position: absolute; left: 0; right: 0; top: 190px; text-align: center; font-size: 36px; font-weight: 600; letter-spacing: -0.012em; }
  #run-panel { position: absolute; left: 50%; top: 520px; width: 980px; margin-left: -490px; font-family: var(--mono); font-size: 36px; }
  #run-panel .row { height: 68px; line-height: 68px; white-space: pre; opacity: 0; }
  #run-panel .k { font-weight: 700; }
  #run-panel .p { display: inline-block; width: 3.6em; padding-left: 1.4em; color: rgba(13, 13, 17, 0.42); }
  #run-panel .bar { display: inline-block; vertical-align: middle; margin: -6px 0 0 30px; width: 250px; height: 22px; border: 2px solid var(--ink); border-radius: 3px; padding: 3px; }
  #run-panel .bar i { display: block; height: 100%; width: 0; border-radius: 1px; background: linear-gradient(90deg, var(--heat-a), var(--heat-b) 55%, var(--heat-c)); }
  .caret { display: inline-block; width: 0.56em; height: 1.02em; vertical-align: -0.16em; margin-left: 0.06em; background: currentColor; }

  /* the prompt */
  #quote { left: 120px; top: 0; width: 900px; height: 1080px; display: flex; flex-direction: column; justify-content: center; }
  #q-head { font-family: var(--mono); font-size: 20px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--heat-b); margin: 0 0 30px; }
  #q-text { margin: 0; font-family: var(--serif); font-style: italic; font-size: 54px; line-height: 1.25; letter-spacing: -0.004em; font-weight: 400; }
  #q-text .t { opacity: 0.3; }
  #q-text .ph { font-family: var(--mono); font-style: normal; font-size: 0.74em; color: var(--heat-c); letter-spacing: -0.02em; }
  #q-text .luckwrap { white-space: nowrap; }
  #q-credit { margin-top: 36px; font-size: 22px; color: var(--dim); letter-spacing: 0.005em; opacity: 0; }
  #q-credit b { color: var(--paper); font-weight: 600; }
  #luck { left: 0; top: 0; font-family: var(--serif); font-style: italic; font-size: 132px; line-height: 1.25; white-space: nowrap; transform-origin: 0 0; letter-spacing: -0.004em; }

  #asset { left: 1100px; top: 896px; width: 620px; font-family: var(--mono); font-size: 26px; white-space: nowrap; display: flex; justify-content: center; gap: 18px; }
  #asset .k { color: var(--heat-c); }
  #asset .roll { position: relative; width: 230px; height: 36px; }
  #asset .roll span { position: absolute; left: 0; top: 0; line-height: 36px; }

  /* standard and All-out */
  #split { left: 0; top: 0; width: 1920px; height: 1080px; opacity: 1; }
  #sp-left { position: absolute; left: 0; top: 0; width: 960px; height: 1080px; background: #07070a; overflow: hidden; }
  #sp-div { position: absolute; left: 0; top: 0; width: 1px; height: 1080px; background: rgba(245, 241, 232, 0.2); }
  .sp-label { position: absolute; top: 268px; font-family: var(--mono); font-size: 24px; letter-spacing: 0.02em; opacity: 0; }
  #std-label { left: 180px; color: var(--dim); }
  #all-label { left: 1040px; color: var(--heat-c); }
  #std-card { position: absolute; left: 180px; top: 320px; width: 600px; height: 338px; background: #15151a; border: 1px solid #2a2a31; border-radius: 10px; }
  #std-card div { position: absolute; background: #2b2b33; border-radius: 3px; }
  #sp-cap { position: absolute; left: 0; right: 0; top: 862px; text-align: center; font-size: 38px; font-weight: 600; letter-spacing: -0.014em; white-space: nowrap; }
  #sp-cap .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.04em 0.03em 0.16em; margin: -0.04em -0.03em -0.16em; }
  #sp-cap .w > span { display: inline-block; }
  #sp-cap em { font-style: normal; color: var(--heat-c); }

  /* end card */
  #end { left: 0; top: 0; width: 1920px; height: 1080px; opacity: 1; }
  #mark { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; opacity: 0; transform-origin: 960px 330px; }
  #e-desc { position: absolute; left: 0; right: 0; top: 500px; text-align: center; font-size: 46px; font-weight: 600; letter-spacing: -0.016em; opacity: 0; }
  #e-sub { position: absolute; left: 0; right: 0; top: 572px; text-align: center; font-size: 25px; color: var(--dim); letter-spacing: 0.003em; opacity: 0; }
  #e-term { position: absolute; left: 960px; top: 654px; transform: translate(-50%, 0); border: 1px solid rgba(245, 241, 232, 0.16); background: rgba(14, 14, 18, 0.72); border-radius: 16px; overflow: hidden; opacity: 0; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45); }
  #e-term .bar { height: 46px; line-height: 46px; text-align: center; font-family: var(--mono); font-size: 18px; letter-spacing: 0.04em; color: var(--dim); border-bottom: 1px solid rgba(245, 241, 232, 0.1); }
  #e-term .body { padding: 24px 44px 26px; font-family: var(--mono); font-size: 31px; line-height: 54px; white-space: pre; }
  #e-term .ln { height: 54px; min-width: 52ch; }
  #e-term .ln .c { color: var(--paper); }
  #e-credit { position: absolute; left: 0; right: 0; top: 986px; text-align: center; font-size: 21px; color: var(--dim); opacity: 0; }
  #e-credit b { color: var(--paper); font-weight: 600; }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  body.nogl #stage { background: radial-gradient(120% 90% at 70% 45%, #1a0d08 0%, #040406 60%); }
</style>
</head>
<body>
<div id="stage" aria-hidden="true">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div id="ui">
    <div id="capA" class="L cap"></div>
    <div id="capB" class="L cap"></div>

    <div id="run" class="L">
      <div id="run-head"></div>
      <div id="run-panel">
        <div class="row"><span class="k"></span></div>
        <div class="row"><span class="p">in</span><span class="v"></span></div>
        <div class="row"><span class="p">on</span><span class="v"></span></div>
        <div class="row"><span class="p">at</span><span class="v"></span><span class="bar"><i></i></span></div>
      </div>
    </div>

    <div id="quote" class="L">
      <div id="q-head">The prompt at its core</div>
      <p id="q-text"></p>
      <div id="q-credit"></div>
    </div>
    <div id="asset" class="L"><span class="k">{asset}</span><span class="roll"></span></div>
    <div id="luck" class="L"><span>Good luck, Claude.</span></div>

    <div id="split" class="L">
      <div id="sp-left">
        <div id="std-label" class="sp-label">standard</div>
        <div id="std-card"></div>
      </div>
      <div id="sp-div"></div>
      <div id="all-label" class="sp-label">All-out</div>
      <div id="sp-cap"></div>
    </div>

    <div id="end" class="L">
      <svg id="mark" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="e-desc"></div>
      <div id="e-sub"></div>
      <div id="e-term"><div class="bar"></div><div class="body"><div class="ln" id="l1"></div><div class="ln" id="l2"></div></div></div>
      <div id="e-credit"></div>
    </div>
  </div>
</div>
<div class="sr-only" id="transcript"></div>

<script>
(function () {
'use strict';

/* ================================================================
   all-out: launch film
   One master clock. Every frame is a pure function of time t, so the
   film stays in sync on any machine and can be frozen with ?t=seconds.
   ================================================================ */

const W = 1920, H = 1080, T_END = 40;
const TAU = Math.PI * 2, DEG = Math.PI / 180;

/* ---------------- utilities ---------------- */
function clamp(x, a, b) { if (a === undefined) { a = 0; b = 1; } return x < a ? a : x > b ? b : x; }
function mix(a, b, t) { return a + (b - a) * t; }
function prog(t, a, b) { return clamp((t - a) / (b - a)); }
const E = {
  inQuad: x => x * x,
  outQuad: x => 1 - (1 - x) * (1 - x),
  inCubic: x => x * x * x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutCubic: x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQuart: x => 1 - Math.pow(1 - x, 4),
  inOutQuart: x => x < 0.5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2,
  outQuint: x => 1 - Math.pow(1 - x, 5),
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutSine: x => -(Math.cos(Math.PI * x) - 1) / 2,
  smooth: x => x * x * (3 - 2 * x),
};
function rng(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(R) { let u = 0; while (u === 0) u = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * R()); }
function lin(hex, k) { const n = parseInt(hex.slice(1), 16); const f = c => Math.pow(c / 255, 2.2) * (k === undefined ? 1 : k); return [f((n >> 16) & 255), f((n >> 8) & 255), f(n & 255)]; }
function track(T, t) {
  if (t <= T[0][0]) return T[0][1];
  for (let i = 1; i < T.length; i++) {
    if (t <= T[i][0]) { const a = T[i - 1], b = T[i]; return mix(a[1], b[1], E.smooth((t - a[0]) / (b[0] - a[0]))); }
  }
  return T[T.length - 1][1];
}
const v3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  lerp: (a, b, t) => [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)],
};

/* ---------------- parameters ---------------- */
const qs = new URLSearchParams(location.search);
const FREEZE = qs.has('t') ? clamp(parseFloat(qs.get('t')) || 0, 0, T_END) : null;
const PQ = qs.has('q') ? clamp(parseFloat(qs.get('q')) || 1, 0.05, 1) : 1;
let QS = qs.has('scale') ? clamp(parseFloat(qs.get('scale')) || 1, 0.25, 1) : 1;

/* ---------------- copy (fixed facts only) ---------------- */
const QUOTE = "Make this {asset} about {subject} the most elaborately, insanely amazing {asset} you've ever seen. [...] I believe you can make it amazing because you have taste and you have the ability. Good luck, Claude.";
const CREDIT_HTML = 'The prompt comes from a post by <b>@fluxxrider</b> on X.';
const INSTALL1 = '/plugin marketplace add StackOneHQ/powerful-plugins';
const INSTALL2 = '/plugin install all-out@powerful-plugins';
const REPO = 'StackOneHQ/powerful-plugins';
const DESC = 'A new open-source plugin for Claude Code and Codex.';
const SUB = 'It builds the most ambitious version of a presentation, launch video, product page, mockup or document.';
const CAP_A = 'all-out sorts every input into *hard* and *soft*.';
const CAP_B = 'It keeps the *hard* ones and drops the *soft* ones.';
const RUN_HEAD = 'The build gets the facts and hard constraints, and no creative direction.';
const RUN_ROWS = ['run the build', 'a fresh context', 'the most capable model', 'the highest effort'];
const SPLIT_CAP = 'Run it alone, or as an extra *All-out* variant next to a standard asset.';
const ASSETS = ['presentation', 'launch video', 'product page', 'mockup', 'document'];
const HARD_WORDS = ['facts', 'names', 'required content', 'format', 'accessibility', 'required brand marks'];
const SOFT_WORDS = ['templates', 'examples', 'layouts', 'beat sheets', 'length targets', '“how we usually do it”'];

/* ---------------- DOM ---------------- */
const $ = id => document.getElementById(id);
const stage = $('stage'), canvas = $('gl');
const styleCache = new WeakMap();
function st(el, prop, val) {
  let c = styleCache.get(el);
  if (!c) { c = {}; styleCache.set(el, c); }
  if (c[prop] !== val) { c[prop] = val; el.style[prop] = val; }
}
function vis(el, on) { st(el, 'visibility', on ? 'visible' : 'hidden'); }
function op(el, o) { st(el, 'opacity', o.toFixed(3)); vis(el, o > 0.002); }
function typeText(el, full, t, t0, cps) {
  const n = clamp(Math.floor((t - t0) * cps), 0, full.length);
  if (el._n !== n) { el._n = n; el.textContent = full.slice(0, n); }
  return n;
}
function wordsHTML(s) {
  return s.split(' ').map(w => {
    const m = /^\*([^*]+)\*(.*)$/.exec(w);
    const inner = m ? '<em class="' + m[1].toLowerCase().replace(/[^a-z]/g, '') + '">' + m[1] + '</em>' + m[2] : w;
    return '<span class="w"><span>' + inner + '</span></span>';
  }).join(' ');
}

$('capA').innerHTML = wordsHTML(CAP_A);
$('capB').innerHTML = wordsHTML(CAP_B);
$('run-head').textContent = RUN_HEAD;
$('q-credit').innerHTML = CREDIT_HTML;
$('sp-cap').innerHTML = wordsHTML(SPLIT_CAP);
$('e-desc').textContent = DESC;
$('e-sub').textContent = SUB;
$('e-term').querySelector('.bar').textContent = REPO;
$('e-credit').innerHTML = CREDIT_HTML;

// the quote, built token by token so its text is exactly the prompt
const qText = $('q-text');
const qTokens = QUOTE.split(' ');
const qEls = [];
const luckWrap = document.createElement('span');
luckWrap.className = 'luckwrap';
for (let i = 0; i < qTokens.length; i++) {
  const n = qTokens.length;
  if (i === n - 3) { qText.appendChild(document.createTextNode(' ')); qText.appendChild(luckWrap); }
  else if (i > 0 && i < n - 3) qText.appendChild(document.createTextNode(' '));
  else if (i > n - 3) luckWrap.appendChild(document.createTextNode(' '));
  const sp = document.createElement('span');
  sp.className = qTokens[i][0] === '{' ? 't ph' : 't';
  sp.textContent = qTokens[i];
  (i >= n - 3 ? luckWrap : qText).appendChild(sp);
  qEls.push(sp);
}
if (qText.textContent !== QUOTE) console.error('quote mismatch');

// reading times for the quote
const READ = [];
(function () {
  let t = 14.75;
  for (let i = 0; i < qTokens.length; i++) {
    const tok = qTokens[i];
    if (tok === '[...]') { t += 0.2; READ.push(t); t += 0.55; continue; }
    if (tok === 'I') t = Math.max(t, 19.55);
    if (tok === 'Good') t = Math.max(t, 24.85);
    READ.push(t);
    t += tok === 'Good' || tok === 'luck,' ? 0.17 : (i < 14 ? 0.29 : 0.305);
  }
})();

// asset roller
const roll = $('asset').querySelector('.roll');
const rollEls = ASSETS.map(a => { const s = document.createElement('span'); s.textContent = a; roll.appendChild(s); return s; });

// standard card
(function () {
  const card = $('std-card');
  const parts = [[44, 46, 290, 26, '#3a3a43'], [44, 104, 250, 12], [44, 138, 210, 12], [44, 172, 230, 12], [44, 206, 160, 12], [380, 104, 176, 150, null]];
  parts.forEach(p => {
    const d = document.createElement('div');
    d.style.left = p[0] + 'px'; d.style.top = p[1] + 'px'; d.style.width = p[2] + 'px'; d.style.height = p[3] + 'px';
    if (p[4]) d.style.background = p[4];
    if (p[4] === null) { d.style.background = 'transparent'; d.style.border = '2px solid #2b2b33'; d.style.borderRadius = '6px'; }
    card.appendChild(d);
  });
})();

// the run panel
const runRows = Array.from(document.querySelectorAll('#run-panel .row')).map((r, i) => ({ el: r, v: r.querySelector(i === 0 ? '.k' : '.v'), full: RUN_ROWS[i] }));
const runFill = document.querySelector('#run-panel .bar i');
const runBar = document.querySelector('#run-panel .bar');

// transcript for assistive tech
$('transcript').innerHTML =
  '<h1>all-out</h1>' +
  '<p>' + CAP_A.replace(/\*/g, '') + ' ' + CAP_B.replace(/\*/g, '') + '</p>' +
  '<p>Hard inputs: ' + HARD_WORDS.join(', ') + '. Soft inputs: ' + SOFT_WORDS.join(', ') + '.</p>' +
  '<p>' + RUN_HEAD + ' Run the build in a fresh context, on the most capable model, at the highest effort.</p>' +
  '<p>The prompt at its core: </p><blockquote></blockquote>' +
  '<p>' + CREDIT_HTML + '</p>' +
  '<p>It can build a ' + ASSETS.join(', ') + '.</p>' +
  '<p>' + SPLIT_CAP.replace(/\*/g, '') + '</p>' +
  '<p>' + DESC + ' ' + SUB + '</p>' +
  '<p>Install:</p><pre></pre>';
$('transcript').querySelector('blockquote').textContent = QUOTE;
$('transcript').querySelector('pre').textContent = INSTALL1 + '\n' + INSTALL2;

/* ---------------- wordmark (custom letterforms, no fonts) ---------------- */
const MARK = (function () {
  const h = 158, w = 40, R = (h - w) / 2, s = 0.2 * h;
  const S = [];
  let x = 0;
  const line = (x1, y1, x2, y2, hot) => S.push({ k: 'l', x1, y1, x2, y2, hot: !!hot });
  const circ = (cx, cy) => S.push({ k: 'c', cx, cy, r: R });
  const cup = (cx, cy) => S.push({ k: 'u', cx, cy, r: R });
  const top = -h + w / 2, bot = -w / 2, mid = -h / 2, asc = -1.42 * h + w / 2;
  circ(x + h / 2, mid); line(x + h / 2 + R, top, x + h / 2 + R, bot); x += h + s;           // a
  line(x + w / 2, asc, x + w / 2, bot); x += w + s * 1.04;                                  // l
  line(x + w / 2, asc, x + w / 2, bot); x += w + s * 0.98;                                  // l
  const hl = 0.36 * h; line(x + w / 2, mid, x + w / 2 + hl, mid, true); x += hl + w + s * 0.98; // hyphen
  circ(x + h / 2, mid); x += h + s;                                                          // o
  line(x + w / 2, top, x + w / 2, mid); cup(x + h / 2, mid); line(x + h / 2 + R, top, x + h / 2 + R, bot); x += h + s * 0.9; // u
  const tw = 0.62 * h;
  line(x + tw / 2, -1.24 * h + w / 2, x + tw / 2, bot); line(x + w / 2, top, x + tw - w / 2, top); x += tw; // t
  const left = Math.round((W - x) / 2), base = 438;
  return { S, h, w, width: x, left, base, top: base - 1.42 * h, bottom: base };
})();
(function buildSVG() {
  const svg = $('mark');
  const NS = 'http://www.w3.org/2000/svg';
  const hs = MARK.S.find(q => q.hot), HOTX = [MARK.left + hs.x1 - MARK.w / 2, MARK.left + hs.x2 + MARK.w / 2];
  const defs = document.createElementNS(NS, 'defs');
  defs.innerHTML = '<linearGradient id="heat" gradientUnits="userSpaceOnUse" x1="' + HOTX[0] + '" y1="0" x2="' + HOTX[1] + '" y2="0"><stop offset="0" stop-color="#ff4a2a"/><stop offset="0.55" stop-color="#ff7d1e"/><stop offset="1" stop-color="#ffc04a"/></linearGradient>';
  svg.appendChild(defs);
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('fill', 'none'); g.setAttribute('stroke-linecap', 'round'); g.setAttribute('stroke-width', MARK.w);
  const L = MARK.left, B = MARK.base;
  for (const s of MARK.S) {
    let e;
    if (s.k === 'c') { e = document.createElementNS(NS, 'circle'); e.setAttribute('cx', L + s.cx); e.setAttribute('cy', B + s.cy); e.setAttribute('r', s.r); }
    else {
      e = document.createElementNS(NS, 'path');

function drawWords(t, c, B, bx, beamI, inkFront, mirror) {
  const Pr = P.text;
  gl.useProgram(Pr.p);
  gl.bindVertexArray(quadVAO);
  UM(Pr, 'uVP', VP); U3(Pr, 'uCamPos', c.pos); U3(Pr, 'uCamFwd', B.f);
  U1(Pr, 'uFocus', c.focus); U1(Pr, 'uAperture', t < 7.45 ? 70 : 70 * (1 - prog(t, 7.45, 8.2)));
  U1(Pr, 'uBeamX', bx); U1(Pr, 'uBeamGlow', 1.4 * beamI);
  U1(Pr, 'uInkFront', mirror ? 1e7 : inkFront); U1(Pr, 'uInkR', mirror ? 1e7 : INKR); U3(Pr, 'uInk', INK); U1(Pr, 'uMirror', mirror ? 1 : 0);
  U3(Pr, 'uBrCol', ICE);
  bindTex(0, WORDS[0].tex.tex); U1i(Pr, 'uTex', 0);
  for (const w of WORDS) {
    if (t < w.ta) continue;
    if (!w.hard && t > w.tEnd) continue;
    if (mirror && t > 7.9) continue;
    const s = wordState(w, t);
    if (s.sc < 0.002) continue;
    let col = BASEW, flash = 0, br = 0, brA = 0;
    if (w.hard && t >= w.tc) {
      const k = E.smooth(prog(t, w.tc, w.tc + 0.25));
      flash = Math.exp(-(t - w.tc) * 3.2) * 1.6;
      col = v3.mul(v3.lerp(BASEW, ICE, k), 1 + flash);
      br = E.outCubic(prog(t, w.tc + 0.05, w.tc + 0.45)) * 15 * (bwPX());
      brA = 1 - prog(t, 7.45, 7.85);
    }
    const alphaIn = E.smooth(prog(t, w.ta, w.ta + 0.3));
    U1(Pr, 'uSoft', w.hard ? 0 : 1);
    U2(Pr, 'uInset', 0.5 * w.tex.pad / w.tex.w, 0.42 * w.tex.pad / w.tex.h);
    bindTex(0, w.tex.tex);
    const ghosts = (!mirror && t < w.ta + 1.2) ? 5 : 0;
    for (let g = ghosts; g >= 0; g--) {
      const sg = g ? wordState(w, t - g * 0.017) : s;
      modelTRS(MW, sg.p[0], sg.p[1], sg.p[2], sg.yaw, sg.pitch, sg.roll, w.qw * sg.sc, w.qh * sg.sc);
      UM(Pr, 'uModel', MW);

      let ta = E.outCubic(prog(t, w.tc, w.tc + 0.3));
      if (w.hard) ta *= 1 - prog(t, 7.4, 7.75);

        const th = 0.2 * (w.qh / (H_EM * w.tex.h / w.tex.px)) * T.h / T.px, tw = th * T.w / T.h;
        const lx = w.textW / 2 + 0.5 * w.padW - (T.textW / T.w) * tw / 2, ly = w.qh * 0.5 - w.padW * 0.42 + 0.06 + th * 0.184 + (1 - ta) * -0.08;
        const off = rotPoint(lx * s.sc, ly * s.sc, 0.02, s.yaw, s.pitch, s.roll);
        modelTRS(MW, s.p[0] + off[0], s.p[1] + off[1], s.p[2] + off[2], s.yaw, s.pitch, s.roll, tw * s.sc, th * s.sc);

}
function bwPX() { return canvas.height / H; }
function drawEmbers(t, tp, c, bw, bh, mirror) {
  gl.useProgram(P.ember.p);

  U1(P.ember, 'uTime', t); U1(P.ember, 'uTimeP', tp); U1(P.ember, 'uMirror', mirror ? 1 : 0);

function drawSwarm(t, tp, c, bw, bh) {
  const s = swarmAt(t);

  const morph = s.k < 0 ? 0 : clamp((t - f.t) / f.d), morphP = s.k < 0 ? 0 : clamp((tp - f.t) / f.d);
  const inten = track(TR.sI, t);

}

/* ---------------- DOM choreography ---------------- */
const D = {
  capA: $('capA'), capB: $('capB'), run: $('run'), runHead: $('run-head'), quote: $('quote'), credit: $('q-credit'),
  asset: $('asset'), luck: $('luck'), luckInner: $('luck').firstElementChild, split: $('split'), spLeft: $('sp-left'), spDiv: $('sp-div'),
  stdLabel: $('std-label'), allLabel: $('all-label'), spCap: $('sp-cap'), end: $('end'), mark: $('mark'), desc: $('e-desc'), sub: $('e-sub'),
  term: $('e-term'), l1: $('l1'), l2: $('l2'), eCredit: $('e-credit'),
};
const capWords = el => Array.from(el.querySelectorAll('.w > span'));
const CW = { a: capWords(D.capA), b: capWords(D.capB), s: capWords(D.spCap) };
const caret = document.createElement('span'); caret.className = 'caret';
const LK = { s0: 0.4, x0: 0, y0: 0, x1: 0, y1: 0 };
function measureLuck() {
  const sr = stage.getBoundingClientRect(), sc = stageScale || 1;
  const prevT = D.quote.style.transform; D.quote.style.transform = 'none';
  const prevL = D.luck.style.transform; D.luck.style.transform = 'none';
  const a = luckWrap.getBoundingClientRect(), b = D.luckInner.getBoundingClientRect();
  D.quote.style.transform = prevT; D.luck.style.transform = prevL;
  const A = { x: (a.left - sr.left) / sc, y: (a.top - sr.top) / sc, w: a.width / sc, h: a.height / sc };
  const Bb = { x: (b.left - sr.left) / sc, y: (b.top - sr.top) / sc, w: b.width / sc, h: b.height / sc };
  if (!Bb.w) return;
  LK.s0 = A.w / Bb.w;
  LK.x0 = A.x - LK.s0 * Bb.x; LK.y0 = A.y - LK.s0 * Bb.y;
  LK.x1 = (W - Bb.w) / 2 - Bb.x; LK.y1 = (H - Bb.h) / 2 - Bb.y - 12;
  styleCache.delete(D.quote); styleCache.delete(D.luck);
}
function capAnim(el, words, t, tin, tout) {
  const on = t >= tin - 0.05 && t <= tout + 0.9;
  vis(el, on);
  if (!on) return;
  st(el, 'opacity', '1');
  words.forEach((w, i) => {
    const a = E.outCubic(prog(t, tin + i * 0.045, tin + i * 0.045 + 0.65));
    const b = E.inCubic(prog(t, tout + i * 0.03, tout + i * 0.03 + 0.42));
    st(w, 'transform', 'translate3d(0,' + ((1 - a) * 108 - b * 108).toFixed(2) + '%,0)');
  });
}
function updateDOM(t) {
  capAnim(D.capA, CW.a, t, 1.3, 4.9);
  capAnim(D.capB, CW.b, t, 5.2, 7.5);

  // the run (white page)
  const runOn = t >= 8.7 && t < IRIS_T1 + 0.02;
  vis(D.run, runOn);
  if (runOn) {
    st(D.run, 'opacity', '1');
    const h = E.outCubic(prog(t, 8.85, 9.45));
    st(D.runHead, 'opacity', h.toFixed(3)); st(D.runHead, 'transform', 'translate3d(0,' + ((1 - h) * 18).toFixed(1) + 'px,0)');
    const T0 = [9.3, 9.8, 10.4, 11.0];
    let typing = -1;
    runRows.forEach((r, i) => {
      st(r.el, 'opacity', E.outCubic(prog(t, T0[i] - 0.05, T0[i] + 0.25)).toFixed(3));
      const n = typeText(r.v, r.full, t, T0[i], 34);
      if (t >= T0[i] && n < r.full.length) typing = i;
    });
    if (typing >= 0) { if (caret.parentNode !== runRows[typing].v.parentNode || caret.previousSibling !== runRows[typing].v) runRows[typing].v.after(caret); }
    else if (caret.parentNode && caret.closest('#run')) caret.remove();
    const f = E.inOutCubic(prog(t, 11.55, 12.25));
    st(runFill, 'width', (f * 100).toFixed(2) + '%');
    const g = t > 12.25 ? Math.exp(-(t - 12.25) * 5) : 0;
    st(runBar, 'boxShadow', g > 0.01 ? '0 0 ' + (g * 46).toFixed(1) + 'px ' + (g * 8).toFixed(1) + 'px rgba(255,122,31,' + (g * 0.85).toFixed(3) + ')' : 'none');
    const k = E.inCubic(prog(t, 12.36, 12.98)), sc = 1 - 0.4 * k;
    st(D.run, 'transform', 'scale(' + sc.toFixed(4) + ')');
    const r = irisR(t);
    st(D.run, 'clipPath', r < 5000 ? 'circle(' + (r / sc).toFixed(1) + 'px at 960px 540px)' : 'none');
  }

  // the prompt
  const qOn = t >= 13.9 && t < 25.95;
  vis(D.quote, qOn);
  if (qOn) {
    const a = E.outCubic(prog(t, 13.95, 14.8)), out = E.inOutCubic(prog(t, 25.15, 25.5));
    st(D.quote, 'opacity', (a * (1 - out)).toFixed(3));
    st(D.quote, 'transform', 'translate3d(' + ((1 - a) * -34).toFixed(1) + 'px,0,0)');
    for (let i = 0; i < qEls.length; i++) {
      const r = E.outCubic(prog(t, READ[i], READ[i] + 0.35));
      let o = 0.3 + 0.7 * r;
      if (i >= qEls.length - 3 && t >= 25.25) o = 0;
      st(qEls[i], 'opacity', o.toFixed(3));
    }
    const cr = E.outCubic(prog(t, 22.2, 22.9));
    st(D.credit, 'opacity', cr.toFixed(3));
  }
  // asset roller
  const aOn = t >= 14.2 && t < 20.0;
  vis(D.asset, aOn);

    st(D.asset, 'opacity', (E.outCubic(prog(t, 14.3, 14.8)) * (1 - E.inCubic(prog(t, 19.5, 19.95)))).toFixed(3));
    const SW = [15.5, 16.6, 17.7, 18.8];
    let f = 0; for (let i = 0; i < 4; i++) f += E.inOutCubic(prog(t, SW[i] - 0.15, SW[i] + 0.2));
    rollEls.forEach((v, i) => { const d = i - f; st(v, 'transform', 'translate3d(0,' + (d * 40).toFixed(2) + 'px,0)'); st(v, 'opacity', clamp(1 - Math.abs(d) * 1.6).toFixed(3)); });
  }

    st(D.spDiv, 'transform', 'translate3d(' + (960 + x).toFixed(1) + 'px,0,0)');

    const d = E.outCubic(prog(t, 36.95, 37.6));
    st(D.desc, 'opacity', d.toFixed(3)); st(D.desc, 'transform', 'translate3d(0,' + ((1 - d) * 16).toFixed(1) + 'px,0)');
    const s = E.outCubic(prog(t, 37.2, 37.85));
    st(D.sub, 'opacity', s.toFixed(3)); st(D.sub, 'transform', 'translate3d(0,' + ((1 - s) * 14).toFixed(1) + 'px,0)');
    const b = E.outCubic(prog(t, 37.45, 38.0));
    st(D.term, 'opacity', b.toFixed(3)); st(D.term, 'transform', 'translate(-50%,' + ((1 - b) * 16).toFixed(1) + 'px)');
    const n1 = typeText(D.l1, INSTALL1, t, 37.8, 60), n2 = typeText(D.l2, INSTALL2, t, 38.75, 60);
    let host = null;

    if (host && t < 39.45) { if (caret.parentNode !== host) host.appendChild(caret); }
    else if (caret.parentNode && caret.closest('#e-term')) caret.remove();
    st(D.eCredit, 'opacity', E.outCubic(prog(t, 39.0, 39.6)).toFixed(3));
  }
}
// keep typed text nodes separate from the caret
(function () {
  [D.l1, D.l2].forEach(l => { const s = document.createElement('span'); s.className = 'c'; l.appendChild(s); l._span = s; });
  const tt = typeText;
  typeText = function (el, full, t, t0, cps) { return tt(el._span || el, full, t, t0, cps); };
})();

/* ---------------- main loop ---------------- */
function drawFrame(t) {
  if (glOK) render(t);
  updateDOM(t);
}
function boot() {
  try { glOK = initGL(); } catch (e) { console.error(e); glOK = false; }
  if (!glOK) document.body.classList.add('nogl');
  if (glOK) allocTargets();
  measureLuck();
  window.addEventListener('resize', () => {

  if (FREEZE !== null) {

    return;
  }
  let t0 = null, warm = 0, slow = 0, last = 0;

    if (warm < 2) { warm++; requestAnimationFrame(frame); return; }
    if (t0 === null) { t0 = now; document.documentElement.setAttribute('data-ready', '1'); }
    let t = (now - t0) / 1000;
    if (t >= T_END) { t = T_END; finished = true; }
    drawFrame(t);
    // adaptive resolution: if frames are slow, render fewer pixels
    if (last) {

let finished = false;

boot();
})();
