<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>overflowing slide</title>
    <style>
      body { margin: 0; font-family: sans-serif; }
      .slide { position: relative; width: 1200px; height: 1500px; overflow: hidden; background: #fff; }
      .logo { position: absolute; left: 60px; top: 60px; }
      /* clipped: nowrap headline wider than the 1200px slide */
      .headline { position: absolute; left: 80px; top: 300px; font-size: 84px; white-space: nowrap; }
      /* covered: opaque card painted over the label (later in DOM order, so it
         wins the stacking contest — the HTML analogue of SVG paint order) */
      .buried { position: absolute; left: 100px; top: 780px; font-size: 44px; color: #111; }
      .card { position: absolute; left: 60px; top: 700px; width: 1080px; height: 220px; background: #f4f4f4; }
    </style>
  </head>
  <body>
    <div class="slide">
      <svg class="logo" width="40" height="40" viewBox="0 0 40 40">
        <text x="2" y="26" font-size="20" font-family="sans-serif">AB</text>
      </svg>
      <div class="headline">Late trains are a timetable problem, not a locomotive problem</div>
      <div class="buried">delayed at the junction</div>
      <div class="card"></div>
    </div>
  </body>
</html>
