<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>clean centred</title>
    <style>
      body { margin: 0; font-family: sans-serif; background: #fff; }
      .card { position: absolute; left: 596px; top: 60px; width: 300px; height: 300px;
              background: #ffffff; border: 1px solid #dddddd; }
      .row { padding: 10px 18px; font-size: 13px; }
      /* Box spans 478..626 and overlaps .card at 596, but the centred glyphs
         only occupy roughly 525..579 and touch nothing. Same for .padded, whose
         box spans 60..760 while its centred glyphs sit near 335..485. */
      .label { position: absolute; left: 478px; top: 150px; width: 148px;
               text-align: center; font-size: 10px; letter-spacing: .08em;
               text-transform: uppercase; color: #999999; }
      .padded { position: absolute; left: 60px; top: 240px; width: 380px;
                padding: 0 160px; text-align: center; font-size: 12px; color: #444444; }
      .neighbour { position: absolute; left: 640px; top: 240px; font-size: 12px; color: #444444; }
    </style>
  </head>
  <body>
    <div class="card"><div class="row">card content</div></div>
    <div class="label">Route 12A</div>
    <div class="padded">centred in a padded block</div>
    <div class="neighbour">adjacent</div>
  </body>
</html>
