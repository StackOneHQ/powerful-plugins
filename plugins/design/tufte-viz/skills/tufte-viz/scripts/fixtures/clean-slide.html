<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>clean slide</title>
    <style>
      body { margin: 0; font-family: sans-serif; }
      .slide { position: relative; width: 1200px; height: 1500px; overflow: hidden; background: #fff; }
      .logo { position: absolute; left: 60px; top: 60px; }
      .headline { position: absolute; left: 80px; top: 300px; width: 1040px; font-size: 84px; }
      .card { position: absolute; left: 60px; top: 700px; width: 1080px; height: 220px; background: #111; }
      .on-card { position: absolute; left: 100px; top: 780px; font-size: 44px; color: #fff; }
    </style>
  </head>
  <body>
    <div class="slide">
      <svg class="logo" width="40" height="40" viewBox="0 0 40 40">
        <text x="2" y="26" font-size="20" font-family="sans-serif">AB</text>
      </svg>
      <div class="headline">Late trains are a timetable problem, not a locomotive problem</div>
      <div class="card"></div>
      <div class="on-card">delayed at the junction</div>
    </div>
  </body>
</html>
