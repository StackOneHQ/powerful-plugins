# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json

# AI review settings for this repository. cubic reads this file from the default branch only,
# so a change here takes effect after it merges. The repository rules below restate the ground
# rules in CLAUDE.md for the parts CI cannot check; keep the two in step.
version: 1

reviews:
  enabled: true
  sensitivity: medium
  incremental_commits: true
  check_drafts: false
  # Public repository: a maintainer starts the review on a pull request from outside the team.
  external_contributors_require_manual_review: true
  resolve_threads_when_addressed: true
  merge_confidence_summary: true
  auto_approve_behavior: disabled
  auto_approve: disabled
  ultrareview: manual
  auto_ultrareview: disabled

  custom_instructions: |
    This is a public marketplace of Claude Code and OpenAI Codex plugins. Each plugin is mostly
    Markdown instructions (skills, commands, agents) plus small scripts and hooks. Review the
    instructions as carefully as the code: a vague or wrong instruction is a bug.

    Claude files are hand-written. The Codex files (.agents/plugins/*, each .codex-plugin/,
    each .codex/ and codex-compat/) are generated by scripts/generate_codex_marketplace.py and
    are excluded from review. CI already enforces version bumps, generator drift, pinned
    external SHAs, catalog validity, real installs in both CLIs and a SkillSpector scan, so do
    not repeat those checks.

  ignore:
    files:
      - .agents/plugins/marketplace.json
      - .agents/plugins/generated-files.json
      - plugins/*/*/.codex-plugin/**
      - plugins/*/*/.codex/**
      - codex-compat/**

  custom_rules:
    - name: Company-agnostic content
      description: |
        Flag anything that ties a plugin to one company, person or machine: StackOne branding
        or product assumptions, employer, client or customer names or data, internal tools,
        URLs or repository names, private repos, credentials, and absolute paths from a
        particular machine (for example /Users/<name>/). This covers examples, test fixtures,
        evals and reference files as well as instructions. StackOne may appear only in author
        fields, the README credit and links to public StackOne open-source tools a plugin
        depends on. A plugin that needs a StackOne account or API belongs in
        StackOneHQ/agent-plugins instead.
      include:
        - plugins/**
        - templates/**
        - docs/**

    - name: Instructions work in Claude Code and Codex
      description: |
        Skill, command and agent instructions must run in both tools. Flag a step that relies
        on a tool only one agent has (such as AskUserQuestion, TodoWrite or a Claude-only MCP
        server) without naming the fallback for the other. A file inside the skill's own folder
        is referenced relative to SKILL.md (references/x.md, scripts/y.sh), which the Agent
        Skills format defines and every host supports; do not flag those. A file elsewhere in
        the plugin, such as a plugin-level scripts/ folder, goes through ${CLAUDE_PLUGIN_ROOT}.
        Flag a path that would resolve against the user's working directory (plugins/..., ../)
        and any invented variable such as CODEX_PLUGIN_ROOT.
      include:
        - plugins/**/skills/**
        - plugins/**/commands/**
        - plugins/**/agents/**
        - templates/**

    - name: Skill descriptions say what and when
      description: |
        The description in SKILL.md frontmatter decides when an agent loads the skill. Flag a
        new or changed description that does not say both what the skill does and when to use
        it, in words a user would type, or that would trigger on requests it cannot handle.
        The frontmatter name must match the skill's directory name.
      include:
        - plugins/**/SKILL.md
        - templates/**/SKILL.md

    - name: Hooks and scripts are safe to install
      description: |
        Anyone can install these plugins, so hooks and bundled scripts run on strangers'
        machines. Flag code that sends prompts, transcripts, file contents or environment data
        to a network service without the README saying so, pipes a download into a shell,
        installs software without a user command asking for it, writes outside the plugin's
        own cache or config paths, or deletes files it did not create. Hooks must fail quietly
        and never block the session on a missing optional dependency.
      include:
        - plugins/**/hooks/**
        - plugins/**/scripts/**
        - plugins/**/*.sh
        - plugins/**/*.py
        - plugins/**/*.js
        - plugins/**/*.mjs

    - name: README matches the plugin
      description: |
        Each plugin's README.md must list the skills, commands, agents and hooks the plugin
        actually ships, with install commands in the form
        /plugin install <name>@powerful-plugins and codex plugin add <name>@powerful-plugins.
        Flag a pull request that adds, renames or removes a component without updating the
        README, or a README that documents something that does not exist.
      include:
        - plugins/**

pr_descriptions:
  generate: true
  skip_if_author_description: true
  cubic_review_link: false
  instructions: |
    List each plugin the pull request changes with its old and new version, and say how the
    change was verified (generator check, tests, a local install in Claude Code or Codex).

issues:
  fix_with_cubic_buttons: true
  pr_comment_fixes: true
  fix_commits_to_pr: true
  auto_fix_sign_commits: true
  coding_agent_provider: cubic
