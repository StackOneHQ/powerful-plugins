name: Scan Skills (SkillSpector)

# Security-scan Claude skills with NVIDIA SkillSpector.
#   - pull request:                 scan skills changed vs main; FAIL on high risk
#   - push to main (merge):          scan every skill; report-only (uploads SARIF)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request whose merge ref to test (set by Sync Codex Plugins)
        required: false
        type: string
      head_sha:
        description: Head commit the merge ref must contain
        required: false
        type: string

permissions:
  actions: read # required by upload-sarif in private repositories
  contents: read
  security-events: write # required to upload SARIF to code scanning

concurrency:
  group: scan-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-skills:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so we can diff against main

      - name: Check out the pull request merge ref
        # Sync Codex Plugins dispatches this workflow after pushing a regenerated commit. A
        # dispatched run checks out the branch head, so move to what the pull request would
        # merge, as a pull_request run does, and test that against main.
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::pr_number must be a number and head_sha a 40-character commit SHA."
            exit 1
          fi
          fetch_args=(--no-tags)
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then fetch_args+=(--depth=2); fi
          # GitHub recomputes the merge ref asynchronously after a push, so wait until it
          # merges the commit that was dispatched.
          for _ in $(seq 1 30); do
            if git fetch "${fetch_args[@]}" origin "+refs/pull/${PR_NUMBER}/merge:refs/remotes/pull/merge" &&
              [ "$(git rev-parse refs/remotes/pull/merge^2)" = "$HEAD_SHA" ]; then
              git checkout --quiet --detach refs/remotes/pull/merge
              git log -1 --format='Testing merge commit %H'
              exit 0
            fi
            sleep 10
          done
          echo "::error::refs/pull/${PR_NUMBER}/merge never merged ${HEAD_SHA}; resolve any conflicts with main."
          exit 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install SkillSpector
        # Pinned to a commit SHA (no PyPI release / tags upstream) for
        # reproducible, supply-chain-safe installs. Bump deliberately.
        run: pip install --upgrade "git+https://github.com/NVIDIA/skillspector.git@2eb844780ab163f01468ecf142c40a2ec0fcaec0"

      - name: Determine scan mode
        id: mode
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
          else
            echo "mode=changed" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch base branch
        if: steps.mode.outputs.mode == 'changed'
        run: git fetch origin main:refs/remotes/origin/main

      - name: Scan skills
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "all" ]; then
            # Full scan on merge to main: report findings, but don't block.
            REPORT_ONLY=1 scripts/scan-skills.sh all
          else
            # Branch / PR: enforce that changed skills are not high-risk.
            scripts/scan-skills.sh changed origin/main
          fi

      - name: Upload SARIF reports (artifact)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skillspector-sarif
          path: skillspector-reports/
          if-no-files-found: ignore

      - name: Check code scanning availability
        id: code-scanning
        if: >-
          always() &&
          hashFiles('skillspector-reports/skillspector.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Code scanning is always available on public repositories; private ones need Code Security.
          if status="$(gh api "repos/$GITHUB_REPOSITORY" --jq 'if .visibility == "public" then "enabled" else (.security_and_analysis.code_security.status // .security_and_analysis.advanced_security.status // "disabled") end')"; then
            echo "Code Security status: $status"
          else
            echo "::warning::Could not determine Code Security status; preserving SARIF as an artifact only."
            status="disabled"
          fi

          if [ "$status" = "enabled" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Code scanning upload skipped; enable Code Security to publish SARIF findings in GitHub."
          fi

      - name: Upload SARIF to code scanning
        # When Code Security is enabled, a real upload failure fails the check.
        # Fork PRs and private repositories without Code Security retain the artifact.
        if: always() && steps.code-scanning.outputs.enabled == 'true'
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: skillspector-reports/skillspector.sarif
          category: skillspector
