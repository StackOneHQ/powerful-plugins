name: Validate Plugins

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request whose merge ref to test (set by Sync Codex Plugins)
        required: false
        type: string
      head_sha:
        description: Head commit the merge ref must contain
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: warp-ubuntu-latest-x64-2x
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check_plugin_versions.py diffs against the merge base, which a shallow clone lacks.
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the pull request merge ref
        # Sync Codex Plugins dispatches this workflow after pushing a regenerated commit. A
        # dispatched run checks out the branch head, so move to what the pull request would
        # merge, as a pull_request run does, and test that against main.
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::pr_number must be a number and head_sha a 40-character commit SHA."
            exit 1
          fi
          fetch_args=(--no-tags)
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then fetch_args+=(--depth=2); fi
          # GitHub recomputes the merge ref asynchronously after a push, so wait until it
          # merges the commit that was dispatched.
          for _ in $(seq 1 30); do
            if git fetch "${fetch_args[@]}" origin "+refs/pull/${PR_NUMBER}/merge:refs/remotes/pull/merge" &&
              [ "$(git rev-parse refs/remotes/pull/merge^2)" = "$HEAD_SHA" ]; then
              git checkout --quiet --detach refs/remotes/pull/merge
              git log -1 --format='Testing merge commit %H'
              exit 0
            fi
            sleep 10
          done
          echo "::error::refs/pull/${PR_NUMBER}/merge never merged ${HEAD_SHA}; resolve any conflicts with main."
          exit 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python validation dependencies
        run: python -m pip install --require-hashes --requirement requirements-dev.txt

      - name: Check Python style and types
        run: |
          ruff check scripts/*.py tests/*.py
          mypy scripts/*.py

      - name: Run compatibility tests with coverage
        run: |
          coverage run --source=scripts.generate_codex_marketplace -m unittest discover -s tests -v
          coverage report --show-missing --fail-under=75

      - name: Check plugin versions were bumped
        run: |
          git fetch --no-tags origin "${GITHUB_BASE_REF:-main}" || true
          python scripts/check_plugin_versions.py --base "origin/${GITHUB_BASE_REF:-main}"

      - name: Check generated Codex metadata
        run: python scripts/generate_codex_marketplace.py --check

      - name: Validate catalogs and Codex packages
        run: python scripts/validate_codex_plugins.py

      - name: Validate pinned external sources
        # Passes without network access while the catalog has no external plugins.
        run: python scripts/validate_external_sources.py --jobs 4

      - name: Validate shell scripts
        run: |
          shellcheck --version
          find scripts plugins -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=error

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.14.0'

      - name: Install pinned agent CLIs
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          mkdir -p "$RUNNER_TEMP/agent-clis"
          pnpm --dir "$RUNNER_TEMP/agent-clis" add --save-exact @anthropic-ai/claude-code@2.1.226 @openai/codex@0.147.0
          echo "$RUNNER_TEMP/agent-clis/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Validate the Claude marketplace
        run: |
          claude --version | grep -F '2.1.226 (Claude Code)'
          claude plugin validate --strict .

      - name: Smoke-test every plugin with Claude Code
        run: python scripts/smoke_test_claude_marketplace.py --claude "$(command -v claude)"

      - name: Smoke-test every plugin with Codex
        run: |
          codex --version | grep -Fx 'codex-cli 0.147.0'
          python scripts/smoke_test_codex_marketplace.py --codex "$(command -v codex)" --batch-size 8

      - name: Summary
        run: |
          # codex-compat/ exists only while the catalog has runtime-adapted external plugins.
          roots="plugins"
          if [ -d codex-compat ]; then roots="plugins codex-compat"; fi
          echo "Claude plugins: $(find plugins -path '*/.claude-plugin/plugin.json' | wc -l)"
          # shellcheck disable=SC2086
          echo "Codex packages: $(find $roots -path '*/.codex-plugin/plugin.json' | wc -l)"
          # shellcheck disable=SC2086
          echo "Skills: $(find $roots -name SKILL.md | wc -l)"

  generator-windows:
    runs-on: warp-windows-2025-x64-4x
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the pull request merge ref
        # Sync Codex Plugins dispatches this workflow after pushing a regenerated commit. A
        # dispatched run checks out the branch head, so move to what the pull request would
        # merge, as a pull_request run does, and test that against main.
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::pr_number must be a number and head_sha a 40-character commit SHA."
            exit 1
          fi
          fetch_args=(--no-tags)
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then fetch_args+=(--depth=2); fi
          # GitHub recomputes the merge ref asynchronously after a push, so wait until it
          # merges the commit that was dispatched.
          for _ in $(seq 1 30); do
            if git fetch "${fetch_args[@]}" origin "+refs/pull/${PR_NUMBER}/merge:refs/remotes/pull/merge" &&
              [ "$(git rev-parse refs/remotes/pull/merge^2)" = "$HEAD_SHA" ]; then
              git checkout --quiet --detach refs/remotes/pull/merge
              git log -1 --format='Testing merge commit %H'
              exit 0
            fi
            sleep 10
          done
          echo "::error::refs/pull/${PR_NUMBER}/merge never merged ${HEAD_SHA}; resolve any conflicts with main."
          exit 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install generator dependencies
        run: python -m pip install --require-hashes --requirement requirements.txt

      - name: Exercise cross-platform generation lock
        run: |
          python -c "import scripts.generate_codex_marketplace"
          python -m unittest tests.test_generate_codex_marketplace.GenerationTests.test_generation_lock_uses_the_cross_platform_lock_abstraction -v
          python -m unittest tests.test_generate_codex_marketplace.GenerationTests.test_generation_lock_failure_does_not_unlock_an_unacquired_lock -v
          python -m unittest tests.test_generate_codex_marketplace.GenerationTests.test_concurrent_generator_processes_converge_without_tempfile_races -v

      - name: Exercise the pinned-upstream materializer lock
        # Runtime adapters bundle this helper, and on Windows its per-checkout lock goes
        # through msvcrt rather than fcntl.
        run: python -m unittest tests.test_materialize_pinned_upstream -v
