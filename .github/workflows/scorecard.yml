name: OpenSSF Scorecard

# Grades this repository's supply-chain hygiene (branch protection, pinned actions, token
# permissions, dangerous workflow patterns, code review, security policy) with OpenSSF
# Scorecard. People install these plugins straight from the repository, so its hygiene is
# what they are trusting. Results go to code scanning and to the public badge in the README.
#
# Scorecard only publishes results from a workflow it can verify: no top-level env or
# defaults, no containers or services, and only checkout, scorecard, upload-artifact and
# upload-sarif as steps. Keep it that way, or publishing fails.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC, so the score reflects settings changes
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write # to upload the SARIF to code scanning
      id-token: write # to publish results and the badge to scorecard.dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the raw results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
