name: Dependabot auto-merge

# Approves Dependabot's own bump pull requests and turns on auto-merge, so they land once the
# required checks pass. It acts only when both the pull request's author and the actor that
# pushed the latest commit are Dependabot, so a person pushing onto a Dependabot branch gets no
# approval, and stale approvals are dismissed on every push.
on: pull_request

permissions: {}

jobs:
  automerge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      github.repository == 'StackOneHQ/powerful-plugins'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Both steps are pinned to the commit Dependabot pushed: the approval names it, and
      # auto-merge only merges it, so a push that lands while this runs gets neither.
      - name: Approve and enable auto-merge for Dependabot's commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          current="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)"
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "::notice::The pull request moved past $HEAD_SHA; leaving it for review."
            exit 0
          fi
          gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            -f commit_id="$HEAD_SHA" -f event=APPROVE >/dev/null
          gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
