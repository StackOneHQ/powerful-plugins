name: Dependabot auto-merge

# Lets Dependabot's bump PRs merge once cubic's review is clean and the required checks pass.
# cubic.yaml has cubic approve Dependabot PRs whose review finds no open issues; this workflow
# asks cubic for that review (it treats Dependabot as an outside contributor, so it does not
# review on its own) and turns on auto-merge. The workflow never approves anything itself.
#
# pull_request_target runs main's copy of this file and never checks out the PR's code, so a
# PR cannot change what it does. Pushes from Dependabot and from cubic's own fix commits keep
# auto-merge on, pinned to that commit. A push from anyone else turns it off and adds
# do-not-auto-approve, so that PR waits for a person's review.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  automerge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'StackOneHQ/powerful-plugins'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Turn on auto-merge, or hand the PR to a person
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          ACTION: ${{ github.event.action }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$ACTOR" in
            dependabot\[bot\]|cubic-dev-ai\[bot\]) ;;
            *)
              gh pr merge --disable-auto "$PR_URL" || true
              gh pr edit "$PR_URL" --add-label do-not-auto-approve
              gh pr comment "$PR_URL" --body "$ACTOR pushed to this Dependabot PR, so auto-merge is off and it needs a person's review."
              exit 0
              ;;
          esac
          current="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)"
          if [ "$current" != "$HEAD_SHA" ]; then
            echo "::notice::The PR moved past $HEAD_SHA; the run for the newer push takes over."
            exit 0
          fi
          if [ "$ACTION" != "synchronize" ] || [ "$ACTOR" = "dependabot[bot]" ]; then
            gh pr comment "$PR_URL" --body "@cubic-dev-ai review this PR"
          fi
          gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
